<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Game</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",

    </script>

<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div id="crosshair">+</div>
            <div id="debug-info"></div>
            <div id="block-selector"></div>
        </div>
        <div id="menu" class="hidden">
            <h2>Voxel Game</h2>
            <button id="resume-btn">Resume</button>
            <button id="save-btn">Save World</button>
            <button id="load-btn">Load World</button>
            <button id="new-world-btn">New World</button>
        </div>
        <div id="mobile-controls" class="hidden">
            <div id="movement-pad"></div>
            <div id="action-buttons">
                <button id="jump-btn">Jump</button>
                <button id="place-btn">Place</button>
                <button id="break-btn">Break</button>
            </div>
        </div>
    </div>
